cli: pi
version: 0.73.1
parser: pi-jsonl
help: help.txt
quota_patterns: [rate limit, rate_limit, '429']
note: Synthetic; built from pi 0.73.1 docs/json.md (AgentSessionEvent) and pi-ai AssistantMessage/Usage types. Not recorded live because pi has no configured provider here.
verified:
  - 'adapter flags: help.txt excerpt regenerated from pi --help 0.73.1 on 2026-11-23 (includes the
    read-only example and built-in tool names read, bash, edit, write, grep, find, ls)'
  - 'not run live: pi has no configured provider here'
  - 'no end-of-options marker: `pi -p --mode json --no-session --no-extensions -- --version` (PI_OFFLINE=1,
    scratch PI_CODING_AGENT_DIR) still prints 0.73.1, so the runner refuses prompts starting with -'
cases:
  success:
    file: success.jsonl
    synthetic: true
    date: '2026-11-23'
    command: [pi, -p, --mode, json, --no-session, 'Create hello.txt containing OK']
    exit_code: 0
    stderr: ''
    expect: {final_text: done, cost_usd: 0.00021, model: claude-haiku-4-5, error: null, quota_hit: false,
             session_ref: 00000000-0000-0000-0000-000000000000, usage: {input_tokens: 20, output_tokens: 10}}
  error:
    file: error.jsonl
    synthetic: true
    date: '2026-11-23'
    command: [pi, -p, --mode, json, --no-session, --model, no-such-model, 'Reply with just: done']
    exit_code: 1
    stderr: ''
    expect: {final_text: '', cost_usd: 0.0, model: claude-haiku-4-5, error: no-such-model, quota_hit: false,
             session_ref: 00000000-0000-0000-0000-000000000000}
  quota:
    file: quota.jsonl
    synthetic: true
    date: '2026-11-23'
    command: [pi, -p, --mode, json, --no-session, 'Reply with just: done']
    exit_code: 1
    stderr: ''
    expect: {final_text: '', cost_usd: 0.0, model: claude-haiku-4-5, error: rate_limit_error, quota_hit: true,
             session_ref: 00000000-0000-0000-0000-000000000000}
