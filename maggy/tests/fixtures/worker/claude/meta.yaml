cli: claude
version: 2.1.330 (Claude Code)
parser: claude-json
help: help.txt
quota_patterns: [rate limit, rate_limit, usage limit, '429']
verified:
  - 'adapter flags: help.txt excerpt regenerated from claude --help 2.1.330 on 2026-11-23'
  - 'live read_only run (scratch git repo, haiku, --max-budget-usd 0.25, stream-json init event):
    --strict-mcp-config with --mcp-config {"mcpServers":{}} still listed plugin-sourced awg tools;
    adding --disallowedTools mcp__awg removed every mcp__awg__* tool; tools were Glob, Grep, Read;
    permissionMode plan; result OK'
  - 'sandbox settings keys (enabled, failIfUnavailable, autoAllowBashIfSandboxed, allowUnsandboxedCommands)
    found in the 2.1.330 settings schema; not exercised live'
  - 'settings sources, no model call (ANTHROPIC_BASE_URL pointed at a closed local port, stream-json
    init event): default argv loaded the user-enabled plugins awg and clawalkietalkie and ran a
    SessionStart hook; --setting-sources project dropped them, but a project .claude/settings.json
    enabling awg@awg plus a SessionStart hook loaded awg and ran the hook; --setting-sources with an
    empty value loaded neither (built-in plugins only) and ran no hook. --safe-mode still loaded awg.'
  - 'end of options, no model call: `-- --version` starts a session (init event) while `--version`
    prints the version'
  - 'live read_only run of the shipped argv on 2026-11-24 (scratch git repo, haiku, --max-budget-usd 0.25,
    stream-json): subscription auth works with --setting-sources empty; init plugins were built-ins only,
    mcp_servers empty, tools Glob, Grep, Read, permissionMode plan, no hook events; result done'
cases:
  success:
    file: success.json
    synthetic: false
    date: '2026-11-23'
    command: [claude, -p, --output-format, json, --permission-mode, acceptEdits, --max-budget-usd, '0.25',
              --no-session-persistence, --setting-sources, project, --strict-mcp-config, --model, haiku,
              'Create a file hello.txt containing exactly OK. Then reply with just: done']
    exit_code: 0
    stderr: ''
    expect: {final_text: done, cost_usd: 0.00192536, model: claude-haiku-5-5, error: null,
             quota_hit: false, session_ref: 00000000-0000-0000-0000-000000000000, usage: {input_tokens: 4, output_tokens: 106}}
  error:
    file: error.json
    synthetic: false
    date: '2026-11-23'
    command: [claude, -p, --output-format, json, --permission-mode, acceptEdits, --max-budget-usd, '0.0001',
              --no-session-persistence, --setting-sources, project, --strict-mcp-config, --model, haiku,
              'Create a file bye.txt containing exactly OK. Then reply with just: done']
    exit_code: 1
    stderr: ''
    expect: {final_text: '', cost_usd: 0.00171252, model: claude-haiku-5-5, error: Reached maximum budget,
             quota_hit: false, session_ref: 00000000-0000-0000-0000-000000000000}
  quota:
    file: quota.json
    synthetic: true
    date: '2026-11-23'
    command: [claude, -p, --output-format, json, --model, haiku, 'Reply with just: done']
    exit_code: 1
    stderr: ''
    expect: {final_text: '', cost_usd: 0.0, model: null, error: rate_limit_error, quota_hit: true,
             session_ref: 00000000-0000-0000-0000-000000000000}
