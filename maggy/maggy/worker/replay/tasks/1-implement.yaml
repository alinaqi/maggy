accept:
  accept_textutil.py: |
    import unittest

    from textutil import slugify


    class AcceptSlugify(unittest.TestCase):
        def test_examples(self):
            self.assertEqual(slugify("Hello World"), "hello-world")
            self.assertEqual(slugify("  Ready, set... go!  "), "ready-set-go")
            self.assertEqual(slugify("Already-Slugged 42"), "already-slugged-42")
            self.assertEqual(slugify(""), "")
solution:
  textutil.py: |
    """Small text helpers."""

    import re


    def slugify(text: str) -> str:
        """Lower-case `text`, keep letters and digits, join the words with single hyphens."""
        return "-".join(re.findall(r"[a-z0-9]+", text.lower()))
