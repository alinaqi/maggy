solution:
  report.py: |
    """Order report."""


    def format_line(label: str, amount: float) -> str:
        return label.ljust(8) + " " + ("%.2f" % amount).rjust(10)


    def summary(orders: list[dict]) -> str:
        paid = [order for order in orders if order["status"] == "paid"]
        lines = [format_line(order["id"], order["amount"]) for order in paid]
        lines.append(format_line("TOTAL", sum(order["amount"] for order in paid)))
        return "\n".join(lines)
