solution:
  greet.py: |
    """Tiny greeting CLI."""

    import argparse


    def main(argv: list[str] | None = None) -> str:
        parser = argparse.ArgumentParser(prog="greet")
        parser.add_argument("name")
        parser.add_argument("--shout", action="store_true", help="greet in upper case")
        args = parser.parse_args(argv)
        message = f"Hello, {args.name}!"
        if args.shout:
            message = message.upper()
        print(message)
        return message


    if __name__ == "__main__":
        main()
  test_greet.py: |
    import unittest

    from greet import main


    class GreetTest(unittest.TestCase):
        def test_greets_by_name(self):
            self.assertEqual(main(["Ada"]), "Hello, Ada!")

        def test_shout(self):
            self.assertEqual(main(["--shout", "Ada"]), "HELLO, ADA!")
