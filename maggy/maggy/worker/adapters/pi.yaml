# pi headless worker. Flags verified against `pi --help` 0.73.1
# (tests/fixtures/worker/pi/help.txt, including its read-only example).
name: pi
tested_version: 0.73.1
version_range: '>=0.73,<1'
detect: [pi, --version]
# pi has no end-of-options marker (`pi -p -- --version` still prints the version), so the
# runner refuses a prompt that starts with '-' for this adapter (templating.prompt_problem).
argv: [pi, -p, --mode, json, --no-session, '{awg_off_flags}', '{model_flags}',
       '{permission_flags}', '{prompt}']
cwd: '{workspace}'
model_flags: [--model, '{model}']
permissions:
  read_only: [--tools, 'read,grep,find,ls']
  workspace: []
# read_only allows only read,grep,find,ls; workspace has every tool (default grant).
grants:
  read_only: {write: false, shell: false}
sandbox:
  native: false
  notes: tool allowlist only, no OS sandbox; writes/shell need isolation or allow_host_execution
output: pi-jsonl
instruction_file: AGENTS.md
quota_patterns: [rate limit, rate_limit, '429']
env:
  # One key only (RFC §2.6.1); other providers: auth file, or override this adapter
  # in ~/.maggy/adapters/pi.yaml.
  provider_keys: [ANTHROPIC_API_KEY]
  auth_files: [~/.pi/agent/auth.json]
disable_awg:
  # No extension discovery: AWG's pi extension (and maggy-hooks.ts) are not loaded;
  # the runner enforces hook gates for workers.
  flags: [--no-extensions]
  env: {}
cost:
  streams: true
