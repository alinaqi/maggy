# Claude Code headless worker. Flags verified against `claude --help` 2.1.330
# (tests/fixtures/worker/claude/help.txt) and a live read_only run (see meta.yaml `verified`).
name: claude
tested_version: 2.1.330
version_range: '>=2.1,<3'
detect: [claude, --version]
# Variadic flags (--tools, --mcp-config, --disallowedTools) are always followed by
# another flag, so the prompt is never swallowed as a list value.
argv: [claude, -p, --no-session-persistence, '{permission_flags}', '{awg_off_flags}',
       '{model_flags}', '{budget_flags}', --output-format, json, '{prompt}']
cwd: '{workspace}'
model_flags: [--model, '{model}']
# Claude stops itself once a run has spent budget.per_run_usd (dropped when unset).
budget_flags: [--max-budget-usd, '{budget_usd}']
permissions:
  # Plan mode plus a read-only built-in tool set: no edits, no shell.
  read_only: [--permission-mode, plan, --tools, 'Read,Grep,Glob']
  # Edits confined to the working directory; Bash runs only inside Claude Code's OS
  # sandbox (failIfUnavailable: refuse rather than run unsandboxed).
  workspace: [--permission-mode, acceptEdits, --settings,
              '{"sandbox":{"enabled":true,"failIfUnavailable":true,"autoAllowBashIfSandboxed":true,"allowUnsandboxedCommands":false}}']
# What each mapping really allows (the launch policy uses these, not the profile).
grants:
  read_only: {write: false, shell: false}
sandbox:
  native: true
  notes: permission modes plus sandbox settings (Seatbelt/bubblewrap) for Bash
output: claude-json
instruction_file: CLAUDE.md
quota_patterns: [rate limit, rate_limit, usage limit, '429']
env:
  # One key only (RFC §2.6.1); a subscription login is read from the real HOME.
  provider_keys: [ANTHROPIC_API_KEY]
  auth_files: []
disable_awg:
  # --strict-mcp-config ignores .mcp.json/~/.claude.json servers but NOT plugin MCP
  # servers (verified live), so the awg server's tools are also denied by name.
  flags: [--strict-mcp-config, --mcp-config, '{"mcpServers":{}}', --disallowedTools, mcp__awg]
  env: {}
cost:
  streams: false
