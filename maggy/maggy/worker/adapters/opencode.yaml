# OpenCode headless worker. Flags verified against `opencode run --help` 1.19.6
# (tests/fixtures/worker/opencode/help.txt); OPENCODE_CONFIG_CONTENT and OPENCODE_PERMISSION
# verified with `opencode debug config` (they override user and project config).
name: opencode
tested_version: 1.19.6
version_range: '>=1.19,<2'
detect: [opencode, --version]
argv: [opencode, run, --format, json, '{awg_off_flags}', '{permission_flags}',
       '{model_flags}', '{prompt}']
cwd: '{workspace}'
model_flags: [-m, '{model}']
permissions:
  read_only: []
  workspace: []
permission_env:
  read_only:
    OPENCODE_PERMISSION: '{"edit":"deny","bash":"deny","webfetch":"deny","websearch":"deny","task":"deny","external_directory":"deny"}'
  workspace:
    OPENCODE_PERMISSION: '{"edit":"allow","bash":"allow","webfetch":"deny","websearch":"deny","external_directory":"deny"}'
sandbox:
  native: false
  notes: permission rules only, no OS sandbox; writes/shell need isolation or allow_host_execution
output: opencode-json
instruction_file: AGENTS.md
quota_patterns: [rate limit, '429']
env:
  provider_keys: [ANTHROPIC_API_KEY, OPENAI_API_KEY, OPENROUTER_API_KEY]
  auth_files: [~/.local/share/opencode/auth.json]
disable_awg:
  # --pure drops external plugins (AWG's heartbeat plugin); the config content
  # disables the awg MCP server whatever the user/project config says.
  flags: [--pure]
  env:
    OPENCODE_CONFIG_CONTENT: '{"mcp":{"awg":{"type":"local","command":["awg"],"enabled":false}}}'
cost:
  streams: true
